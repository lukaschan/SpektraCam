name: Sync Upstream

# 每日同步上游 runzeni/SpektraCam 的 main：
# - 无更新：直接结束，不构建
# - 有更新：merge 进 fork 的 main 并推送，随后在同一次运行里调用
#   build-and-release.yml 编译并发布 Release（用 workflow_call，
#   不依赖机器人推送触发——GITHUB_TOKEN 的推送不会触发其他工作流）
# - merge 冲突：本工作流失败停住，等人工处理，不强推

on:
  schedule:
    - cron: '17 3 * * *' # 每日 03:17 UTC（台北 11:17）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.merge.outputs.updated }}
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/runzeni/SpektraCam.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin main
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Merged upstream up to $(git rev-parse --short upstream/main)"

  build:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/build-and-release.yml
    permissions:
      contents: write
    secrets: inherit
